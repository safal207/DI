name: Native record bridge

on:
  pull_request:
    paths:
      - "integration/native-record-bridge/**"
      - "scripts/validate_native_record_bridge.py"
      - "tests/test_native_record_bridge.py"
      - ".github/workflows/native-record-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DI integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned DIF
        uses: actions/checkout@v4
        with:
          repository: safal207/DIF
          ref: a5a8d330a6308a4c7990be2a4d46211cc030d05d
          path: .bridge/DIF
          persist-credentials: false

      - name: Checkout pinned DRP
        uses: actions/checkout@v4
        with:
          repository: safal207/DRP
          ref: 92e63d7d4eeb55f8eb61956da002dc8951bab1c6
          path: .bridge/DRP
          persist-credentials: false

      - name: Checkout pinned TIP
        uses: actions/checkout@v4
        with:
          repository: safal207/transition-intelligence-protocol
          ref: 6b272febd048cf8e218417b3c0506c7fa4fa43fa
          path: .bridge/TIP
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install schema validator
        run: python -m pip install "jsonschema>=4.20,<5"

      - name: Validate the pinned native-record bridge
        env:
          DIF_ROOT: .bridge/DIF
          DRP_ROOT: .bridge/DRP
          TIP_ROOT: .bridge/TIP
        run: |
          python scripts/validate_native_record_bridge.py \
            --dif-root "$DIF_ROOT" \
            --drp-root "$DRP_ROOT" \
            --tip-root "$TIP_ROOT"

      - name: Run adversarial bridge regressions
        env:
          DIF_ROOT: .bridge/DIF
          DRP_ROOT: .bridge/DRP
          TIP_ROOT: .bridge/TIP
        run: python -m unittest tests.test_native_record_bridge -v
