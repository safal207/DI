name: Validate native record bridge

on:
  pull_request:
    paths:
      - "integration/native-record-bridge/**"
      - "scripts/validate-native-record-bridge.py"
      - "scripts/native_bridge_io.py"
      - "scripts/native_bridge_rules.py"
      - "tests/test_native_record_bridge*.py"
      - "docs/native-record-bridge-v0.1.md"
      - ".github/workflows/validate-native-record-bridge.yml"
  push:
    branches:
      - main
    paths:
      - "integration/native-record-bridge/**"
      - "scripts/validate-native-record-bridge.py"
      - "scripts/native_bridge_io.py"
      - "scripts/native_bridge_rules.py"
      - "tests/test_native_record_bridge*.py"
      - "docs/native-record-bridge-v0.1.md"
      - ".github/workflows/validate-native-record-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-record-bridge:
    runs-on: ubuntu-latest

    steps:
      - name: Check out DI bridge branch with full ancestry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install integration-only DIF schema test dependencies
        run: >-
          python -m pip install
          jsonschema==4.26.0
          rfc3339-validator==0.1.4

      - name: Require the merged DI hardening base as an ancestor
        run: |
          git cat-file -e e6dba82590f3470b1f9bfa56ca5132f60eb661b5^{commit}
          git merge-base --is-ancestor e6dba82590f3470b1f9bfa56ca5132f60eb661b5 HEAD

      - name: Check out pinned DIF
        uses: actions/checkout@v4
        with:
          repository: safal207/DIF
          ref: a5a8d330a6308a4c7990be2a4d46211cc030d05d
          path: .upstream/DIF

      - name: Check out pinned DRP
        uses: actions/checkout@v4
        with:
          repository: safal207/DRP
          ref: 92e63d7d4eeb55f8eb61956da002dc8951bab1c6
          path: .upstream/DRP

      - name: Check out pinned TIP
        uses: actions/checkout@v4
        with:
          repository: safal207/transition-intelligence-protocol
          ref: 6b272febd048cf8e218417b3c0506c7fa4fa43fa
          path: .upstream/TIP

      - name: Run bridge regression tests
        run: >-
          python -m unittest discover
          -s tests
          -p 'test_native_record_bridge*.py'
          -v

      - name: Validate pinned native records and derived projection
        run: >-
          python scripts/validate-native-record-bridge.py
          --upstream-root .upstream
          --pretty
