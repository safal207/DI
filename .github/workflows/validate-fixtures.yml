name: Validate DI fixtures

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-fixtures:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate fixtures
        run: python scripts/validate-fixtures.py

      - name: Validate recovery decision execution binding
        run: python scripts/validate-recovery-binding.py

      - name: Validate use-time authority binding
        run: python scripts/validate-authority-binding.py

      - name: Validate single-use authority consumption
        run: python scripts/validate-authority-consumption.py

      - name: Validate strategy path binding
        run: python scripts/validate-strategy-binding.py

      - name: Validate decision replanning after path invalidation
        run: python scripts/validate-decision-replan.py

      - name: Validate full end-to-end integrity trace
        run: python scripts/validate-end-to-end-integrity.py

      - name: Validate multi-agent dispatch ownership continuity
        run: python scripts/validate-multi-agent-dispatch.py

      - name: Validate lease expiry and split-brain fencing
        run: python scripts/validate-lease-split-brain.py

      - name: Smoke-test DI conformance CLI v0.2
        run: |
          python scripts/di-conformance.py fixtures/valid-end-to-end-integrity-v0.2.json --pretty > conformance-report-v0.2.json
          cat conformance-report-v0.2.json

      - name: Smoke-test DI conformance CLI v0.3
        run: |
          python scripts/di-conformance.py fixtures/valid-multi-agent-dispatch-takeover-v0.3.json --profile multi-agent-dispatch-v0.3 --pretty > conformance-report-v0.3.json
          cat conformance-report-v0.3.json

      - name: Smoke-test DI conformance CLI v0.4
        run: |
          python scripts/di-conformance.py fixtures/valid-lease-split-brain-recovery-v0.4.json --profile lease-split-brain-v0.4 --pretty > conformance-report-v0.4.json
          cat conformance-report-v0.4.json
