name: Validate DI fixtures

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-fixtures:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate fixtures
        run: python scripts/validate-fixtures.py

      - name: Validate recovery decision execution binding
        run: python scripts/validate-recovery-binding.py

      - name: Validate use-time authority binding
        run: python scripts/validate-authority-binding.py

      - name: Validate single-use authority consumption
        run: python scripts/validate-authority-consumption.py

      - name: Validate strategy path binding
        run: python scripts/validate-strategy-binding.py

      - name: Validate decision replanning after path invalidation
        run: python scripts/validate-decision-replan.py

      - name: Validate full end-to-end integrity trace
        run: python scripts/validate-end-to-end-integrity.py
