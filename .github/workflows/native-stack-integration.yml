name: Native stack integration v0.1

on:
  pull_request:
    paths:
      - "integration/native-stack-v0.1/**"
      - ".github/workflows/native-stack-integration.yml"
  push:
    branches: [main]
    paths:
      - "integration/native-stack-v0.1/**"
      - ".github/workflows/native-stack-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-stack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out DI
        uses: actions/checkout@v4
        with:
          path: DI
          fetch-depth: 0

      - name: Check out pinned DIF
        uses: actions/checkout@v4
        with:
          repository: safal207/DIF
          ref: a5a8d330a6308a4c7990be2a4d46211cc030d05d
          path: external/DIF

      - name: Check out pinned DRP
        uses: actions/checkout@v4
        with:
          repository: safal207/DRP
          ref: 92e63d7d4eeb55f8eb61956da002dc8951bab1c6
          path: external/DRP

      - name: Check out pinned TIP
        uses: actions/checkout@v4
        with:
          repository: safal207/transition-intelligence-protocol
          ref: 6b272febd048cf8e218417b3c0506c7fa4fa43fa
          path: external/TIP

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install integration-only schema dependencies
        run: python -m pip install -r DI/integration/native-stack-v0.1/requirements-integration.txt

      - name: Validate pinned native stack baseline
        working-directory: DI
        run: >-
          python integration/native-stack-v0.1/validate_native_stack.py
          --dif-root ../external/DIF
          --drp-root ../external/DRP
          --tip-root ../external/TIP

      - name: Run targeted negative matrix
        working-directory: DI
        run: >-
          python integration/native-stack-v0.1/run_negative_matrix.py
          --dif-root ../external/DIF
          --drp-root ../external/DRP
          --tip-root ../external/TIP
          -v

      - name: Independently validate canonical DIF ConfirmedIntent
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import FormatChecker, validators
          schema = json.loads(Path('external/DIF/schemas/confirmed-intent.schema.json').read_text())
          record = json.loads(Path('DI/integration/native-stack-v0.1/records/confirmed-intent.json').read_text())
          cls = validators.validator_for(schema)
          cls.check_schema(schema)
          errors = list(cls(schema, format_checker=FormatChecker()).iter_errors(record))
          if errors:
              raise SystemExit("DIF schema errors: " + "; ".join(e.message for e in errors))
          print("PASS pinned DIF ConfirmedIntent")
          PY

      - name: Independently run native DRP validator
        working-directory: external/DRP
        run: python tools/drp_validator.py ../../DI/integration/native-stack-v0.1/records/drp-record.json

      - name: Independently run native TIP validator
        working-directory: external/TIP
        run: python -m tip validate ../../DI/integration/native-stack-v0.1/records/tip-record.tip.json
